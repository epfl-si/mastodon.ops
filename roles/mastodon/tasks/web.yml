- name: Mastodon web directories
  ansible.builtin.file:
    state: directory
    recurse: yes
    path: "{{ item }}"
    mode: 0777
  with_items:
    - "{{ mastodon_web_dir }}/public/system"
    - "{{ mastodon_web_build_dir | dirname }}"

- name: Clone mastodon.ops to build Docker images out of it
  git:
    repo: https://github.com/epfl-si/mastodon.ops.git
    dest: '{{ mastodon_web_build_dir }}'
  register: _web_build_dir

- name:
  community.docker.docker_image:
    name: "{{ mastodon_web_image }}"
    source: build
    force_source: yes
    build:
      path: '{{ mastodon_web_build_dir }}/docker/mastodon-web'

- name: Mastodon web container
  community.docker.docker_container:
    name: "{{ mastodon_web_container_name }}"
    image: "{{ mastodon_web_image }}"
    ports:
      - "3000:3000"
    restart_policy: unless-stopped
    networks:
      - name: "{{ mastodon_docker_external_network_name }}"
      - name: "{{ mastodon_docker_internal_network_name }}"
    volumes:
      - "{{ mastodon_web_dir }}/public/system:/mastodon/public/system"
    env: "{{ mastodon_env }}"
    healthcheck:
      test: ['CMD-SHELL',"curl -s --noproxy localhost localhost:3000/health | grep -q 'OK' || exit 1"]
    command: 'bundle exec puma -C config/puma.rb'
  tags:
    - mastodon.web.run

- name: Mastodon streaming container
  community.docker.docker_container:
    name: "{{ mastodon_streaming_container_name }}"
    image: "{{ mastodon_web_streaming_image }}"
    ports:
      - "4000:4000"
    restart_policy: unless-stopped
    networks:
      - name: "{{ mastodon_docker_external_network_name }}"
      - name: "{{ mastodon_docker_internal_network_name }}"
    env: "{{ mastodon_env }}"
    healthcheck:
      test: ['CMD-SHELL', "curl -s --noproxy localhost localhost:4000/api/v1/streaming/health | grep -q 'OK' || exit 1"]
    command: 'node ./streaming'
  tags:
    - mastodon.streaming.run

- name: Mastodon sidekiq container
  community.docker.docker_container:
    name: "{{ mastodon_sidekiq_container_name }}"
    image: "{{ mastodon_web_image }}"
    restart_policy: unless-stopped
    networks:
      - name: "{{ mastodon_docker_external_network_name }}"
      - name: "{{ mastodon_docker_internal_network_name }}"
    volumes:
      - "{{ mastodon_web_dir }}/public/system:/mastodon/public/system"
    env: "{{ mastodon_env }}"
    healthcheck:
      test: ['CMD-SHELL', "ps aux | grep '[s]idekiq\ 6' || false"]
    command: 'bundle exec sidekiq'
  tags:
    - mastodon.sidekiq.run
